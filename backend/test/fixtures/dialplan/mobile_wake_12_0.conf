exten => s,1,GotoIf($["${OPDESKWAKE_PENDING}"!="1"]?done)
 same => n,Set(OPDESKWAKE=${CURL(http://127.0.0.1:8765/api/internal/mobile-wake/${OPDESKWAKE_EXT}/cancel?uid=${URIENCODE(${OPDESKWAKE_UID})})})
 same => n(done),Return()
